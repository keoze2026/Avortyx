# Avortyx Guard, layer 2 (CH-355, CH-356): the review bot reads every portal
# pull request against docs/SYSTEM-MAP.md and posts an impact report on it.
# Needs one secret: REVIEW_BOT_API_KEY (the bot's AI key). It comments with
# this repo's own GitHub token, so no extra GitHub app is needed.
name: Review bot

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: review-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.REVIEW_BOT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          prompt: |
            You are the Avortyx Guard reviewer for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} (the portal).
            1. Read docs/REVIEW-BOT.md, docs/SYSTEM-MAP.md, and the CHANGES.md entries this change adds or names.
            2. Read the change: `gh pr diff ${{ github.event.pull_request.number }}`.
            3. For every component, store, service, type or API call it changes, search the code for every other place that uses it (Grep). Decide whether those pages still behave the same.
            4. Check the rules in docs/SYSTEM-MAP.md section 6 and docs/REVIEW-BOT.md: API paths in contract/api-paths.txt, all four languages, partner logins never see money, old-server behaviour until the restart, no secrets.
            Then post ONE comment with `gh pr comment ${{ github.event.pull_request.number }} --body "..."`, plain English, under 400 words, in this form:
            ## Avortyx Guard review
            **Verdict:** Safe to merge / Merge after fixes / Do not merge - one line why.
            **Sections touched:** ...
            **Other sections affected:** each one, and whether it still works (name the file and function).
            **Numbers on screen:** could any total, cost or count shown change? On which tabs?
            **Checks:** type check, contract check, translations - anything missing.
            **Backend:** does it need a backend change or the server restart first?
            **Fix before merge:** numbered list, or "nothing".
            Only report what you checked in the code; say "not checked" rather than guess.
